<!DOCTYPE html>
<html lang="pt-br">
    <head>
        <meta charset="UTF-8">
        <title>Riot Games</title>
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap" rel="stylesheet">
        <link rel="stylesheet" href="style.css">
    </head>
    <body>
        <header >

        </header>
        <main class="main-container">
                <div class="logo-container">
                    <img class="logo" src="assets/imagens/riot-logo.png" alt="imagem de logo">
                    <span>SIGN IN</span>
                    <div class="login-1">
                        <input class="campo-login" type="text" id="usuario" name="usuario" placeholder="USER" required />
                        <img src="assets/imagens/icons8-person-32.png" alt="icone de perfil">
                    </div>
                    <div class="login-2">
                         <input class="campo-login" type="password" id="senha" name="senha" placeholder="PASSWORD" required>
                         <img src="assets/imagens/icons8-ocultar-32.png" alt="icone de ocultar">
                    </div>
                    <div class="esqueceu-senha">
                        <div>
                        <input type="checkbox" id="caixa-selecao" name="caixa-selecao">
                        <label for="caixa-selecao">Remenber Me</label>
                        </div>
                        <p>Forgot password ?</p>
                    </div>
                     <button class="btn-sign" type="button">SING IN</button> 
                     <span class="sub-texto"><p>Don't have an acount ? <b> Sing UP</b></p><br><hr><p><br>Or Sing in With</p></span>
                     <div class="btn-acesso">
                        <button class="btn-ajuste-1" type="button"><img class="google" src="assets/imagens/icons8-google-logo-48.png" alt="imagem da logo google"></button>
                        <button class="btn-ajuste-2" type="button"><img class="xbox" src="assets/imagens/icons8-xbox-50.png" alt="imagem logo xbox"></button>
                     </div>
                </div>
        </main>
    </body>
</html>
