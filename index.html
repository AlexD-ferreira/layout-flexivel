<!DOCTYPE html>
<html lang="pt-br">
    <head>
        <meta charset="UTF-8">
        <title>Riot Games</title>
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap" rel="stylesheet">
        <link rel="stylesheet" href="style.css">
    </head>
    <body>
        <header >

        </header>
        <main class="main-container">
            <div class="central">
                <div class="logo-container">
                    <img class="logo" src="assets/imagens/riot-logo.png" alt="imagem de logo">
                    <span>SIGN IN</span>
                    <div class="login">
                        <input class="campo-login" type="text" id="usuario" name="usuario" placeholder="USER" required>
                        <input class="campo-login" type="password" id="senha" name="senha" placeholder="PASSWORD" required>
                    </div>
                    <div class="esqueceu-senha">
                        <div>
                        <input type="checkbox" id="caixa-selecao" name="caixa-selecao">
                        <label for="caixa-selecao">Remenber Me</label>
                        </div>
                        <p>Forgot password ?</p>
                    </div>
                     <button class="btn-sign" type="button">SING IN</button> 
                </div>
            </div>
        </main>
    </body>
</html>
